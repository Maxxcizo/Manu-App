<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen Flow Map · Bosque La Primavera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Page size is set from JS (see LAYOUT) so the whole map prints on ONE page */
  :root {
    --ink: #172f40; --muted: #627480; --border: #dfe6e7; --bg: #f4f6f6;
    --nav: #175b47; --error: #b93e34; --back: #8a9aa5; --push: #2c6388;
    --AUTH: #6b4fbb; --API: #2c6388; --GEO: #175b47; --FILES: #98601e; --SYNC: #b93e34; --DEVICE: #627480;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #map { position: relative; }

  /* Header */
  .header { position: absolute; left: 60px; top: 50px; right: 60px; display: flex; gap: 60px; align-items: flex-start; }
  .header h1 { font-size: 64px; font-weight: 800; line-height: 1.05; }
  .header .sub { font-size: 22px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .legend { margin-left: auto; display: grid; grid-template-columns: auto auto auto; gap: 22px 48px; font-size: 21px; }
  .legend h4 { grid-column: 1 / -1; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -10px; }
  .legend .item { display: flex; align-items: center; gap: 12px; white-space: nowrap; }

  /* Lanes */
  .lane { position: absolute; left: 30px; right: 30px; border-radius: 28px; }
  .lane__label { position: absolute; right: 0; top: 0; bottom: 0; width: 120px; display: flex; align-items: center; justify-content: center; }
  .lane__label span { transform: rotate(-90deg); white-space: nowrap; font-size: 30px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .lane__label small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; text-transform: none; text-align: center; opacity: .8; }

  /* Screen nodes */
  .node { position: absolute; display: flex; gap: 16px; padding: 16px; background: #fff; border: 2px solid var(--border); border-radius: 22px; box-shadow: 0 6px 24px rgba(20,45,64,.08); }
  .node--error { border-color: #e7b2ac; background: #fff8f6; }
  .node--entry { border-color: var(--nav); }
  .node img.thumb { width: 200px; height: auto; align-self: flex-start; border-radius: 14px; box-shadow: 0 2px 10px rgba(20,45,64,.15); }
  .card { width: 380px; font-size: 13.5px; line-height: 1.4; display: flex; flex-direction: column; gap: 10px; }
  .card__code { font-size: 13px; font-weight: 800; color: #fff; background: var(--ink); border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
  .node--error .card__code { background: var(--error); }
  .card__title { font-size: 22px; font-weight: 800; line-height: 1.15; }
  .card__en { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card h5 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .card ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .card .contents li::before { content: "• "; color: var(--muted); }
  .act { display: flex; gap: 7px; align-items: flex-start; }
  .act__n { flex: none; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .act__to { font-weight: 700; white-space: nowrap; }
  .act__to.inline { color: var(--muted); font-weight: 500; font-style: italic; }
  .be { display: flex; flex-direction: column; gap: 4px; }
  .chip { display: flex; gap: 6px; align-items: baseline; font-size: 12px; }
  .chip b { flex: none; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; letter-spacing: .04em; }
  .chip code { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--ink); }

  @media print { .node, .node img.thumb { box-shadow: none !important; } }
  svg#edges { position: absolute; left: 0; top: 0; pointer-events: none; }
  .badge text { font: 800 12px Inter, sans-serif; fill: #fff; }

  /* Footer */
  .footer { position: absolute; left: 60px; right: 60px; display: grid; grid-template-columns: 1.7fr 1fr; gap: 60px; }
  .footer h3 { font-size: 34px; font-weight: 800; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 19px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  td .codes { font-weight: 700; }
  .notes { font-size: 20px; line-height: 1.55; display: flex; flex-direction: column; gap: 14px; }
  .notes p b { color: var(--nav); }
</style>
</head>

    <div class="legend">
      <h4>Arrows</h4>
      ${Object.values(KINDS).map((k) => `<span class="item"><svg width="70" height="14"><line x1="2" y1="7" x2="58" y2="7" stroke="${k.color}" stroke-width="4" stroke-dasharray="${k.dash}"/><path d="M58 1 L68 7 L58 13 Z" fill="${k.color}"/></svg>${k.label}</span>`).join("")}
      <span class="item"><svg width="24" height="24"><circle cx="12" cy="12" r="11" fill="#175b47"/><text x="12" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">2</text></svg>Number = action in the screen card</span>
      <h4>Back-end sources</h4>
      ${Object.entries(SERVICES).map(([k, v]) => `<span class="item"><span class="chip"><b style="background:var(--${k})">${k}</b></span>${v}</span>`).join("")}
    </div>
  </div>`);

// Lanes
for (const lane of LANES) {
  const y = L.top + lane.rows[0] * L.rowH - 40;
  const h = (lane.rows[1] - lane.rows[0] + 1) * L.rowH - 40;
  map.insertAdjacentHTML("beforeend", `
    <div class="lane" style="top:${y}px;height:${h}px;background:${lane.color};left:${L.left + L.colW - 130}px">
      <div class="lane__label" style="color:${lane.ink}"><span>${lane.name}<small>${lane.sub}</small></span></div>
    </div>`);
}
map.insertAdjacentHTML("beforeend", `
  <div class="lane" style="top:${L.top - 40}px;height:${L.rows * L.rowH - 40}px;width:${L.colW - 20}px;background:#f4f6f6">
    <div class="lane__label" style="color:#172f40"><span>Entry<small>all roles</small></span></div>
  </div>`);

// Nodes
for (const s of SCREENS) {
  const p = pos(s);
  const k = s.type === "error" ? "node--error" : s.type === "entry" ? "node--entry" : "";
  map.insertAdjacentHTML("beforeend", `
    <div class="node ${k}" id="n-${s.id}" style="left:${p.x}px;top:${p.y}px">
      <img class="thumb" src="thumbs/${s.id}.png" alt="">
      <div class="card">
        <span class="card__code">${s.code}</span>
        <div><p class="card__title">${s.title}</p><p class="card__en">${s.en}</p></div>
        <div><h5>Purpose</h5><p>${s.purpose}</p></div>
        <div><h5>Contents</h5><ul class="contents">${s.contents.map((c) => `<li>${c}</li>`).join("")}</ul></div>
        <div><h5>Actions</h5><ul>${s.actions.map((a, i) => `
          <li class="act"><span class="act__n" style="background:${KINDS[kindOf(a)].color}">${i + 1}</span>
          <span>${a.t} → ${a.to ? `<span class="act__to">${byId[a.to].code} ${byId[a.to].title}</span>` : `<span class="act__to inline">${a.inline}</span>`}</span></li>`).join("")}</ul></div>
        <div><h5>Back-end calls</h5><div class="be">${s.be.map(([svc, call]) => `<span class="chip"><b style="background:var(--${svc})">${svc}</b><code>${call}</code></span>`).join("")}</div></div>
      </div>
    </div>`);
}

// Footer: back-end service → screens
const footY = L.top + L.rows * L.rowH + 20;
const uses = Object.fromEntries(Object.keys(SERVICES).map((k) => [k, []]));
SCREENS.forEach((s) => new Set(s.be.map(([k]) => k)).forEach((k) => uses[k].push(s.code)));
map.insertAdjacentHTML("beforeend", `
  <div class="footer" style="top:${footY}px">
    <div>
      <h3>Where the data comes from (back-end services · Stage 1)</h3>
      <table>
        <tr><th>Source</th><th>Role in the system</th><th>Screens that call it</th></tr>
        ${Object.entries(SERVICES).map(([k, v]) => `<tr><td><span class="chip"><b style="background:var(--${k})">${k}</b></span></td><td>${v}</td><td class="codes">${uses[k].join(" · ")}</td></tr>`).join("")}
      </table>
    </div>
    <div class="notes">
      <h3>Notes</h3>
      <p><b>Offline-first.</b> Field screens (R1–R8) read from the local cache and write to a local queue. The Sync &amp; Queue engine sends the queue when there is signal; if it fails, the user goes to E1 and nothing is lost.</p>
      <p><b>RBAC.</b> Every API call carries the JWT from A1. If the role lacks a permission, the API answers 403 and the app shows E2 (SEG-403).</p>
      <p><b>Data confidence.</b> C1/C2 show an alert when the selected period has too few records for a reliable comparison (Stage 1 NFR).</p>
      <p><b>Performance targets.</b> Spatial queries and period comparisons &lt; 5 s; up to 50 concurrent field operators and dispatchers.</p>
    </div>
  </div>`);

// ------------------------------------------------------------------
// Edges: orthogonal "metro" routing.
// Leave source from its bottom → run along the corridor under the
// source row → climb/descend in the gutter left of the target column
// → enter the target from its left side.
// ------------------------------------------------------------------
function drawEdges() {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.id = "edges";
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.innerHTML = `<defs>${Object.entries(KINDS).map(([k, v]) => `<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="${v.color}"/></marker>`).join("")}</defs>`;
  const rect = (id) => {
    const el = document.getElementById("n-" + id);
    return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  };
  const corridorSlots = {}, gutterSlots = {}, entrySlots = {};
  const take = (bag, key) => (bag[key] = (bag[key] ?? -1) + 1);
  const lines = [], badges = [];

  for (const s of SCREENS) {
    const a = rect(s.id);
    s.actions.forEach((act, i) => {
      if (!act.to) return;
      const t = byId[act.to], b = rect(act.to), k = KINDS[kindOf(act)];
      const sx = a.x + 40 + i * 30;
      const sy = a.y + a.h;
      const cy = L.top + s.row * L.rowH + L.nodeMaxH + 30 + take(corridorSlots, s.row) * 9;
      const gx = b.x - 24 - take(gutterSlots, t.col) * 9;
      const ey = b.y + 60 + take(entrySlots, t.id) * 22;
      const d = `M${sx},${sy} V${cy} H${gx} V${ey} H${b.x - 3}`;
      lines.push(`<path d="${d}" fill="none" stroke="${k.color}" stroke-width="3.5" stroke-dasharray="${k.dash}" stroke-linejoin="round" marker-end="url(#m-${kindOf(act)})" opacity=".9"/>`);
      badges.push(`<g class="badge"><circle cx="${sx}" cy="${sy + 16}" r="12" fill="${k.color}" stroke="#fff" stroke-width="2"/><text x="${sx}" y="${sy + 20}" text-anchor="middle">${i + 1}</text></g>`);
    });
  }
  svg.innerHTML += lines.join("") + badges.join("");
  map.appendChild(svg);
}

// Wait for fonts and thumbnails so node sizes are final before routing
Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.complete ? 0 : new Promise((r) => (img.onload = img.onerror = r)))])
  .then(drawEdges);
</script>
</body>
</html>
